<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacktrack</title>
    <link rel="stylesheet" href="css/component.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/variable.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
        </aside>
        
        <main class="main">
            <header class="header">

            </header>

            <section id="container">
                <div id="project-section">
                    <h2>Create A New Project</h2>
                    <form id="project-form">
                        <label for="project-name">Project Name:
                            <input type="text" id="project-name"required>
                        </label>
                        <label for="project-description">Project Description (Optional):
                            <input type="text" id="project-description">
                        </label>
                        <label for="project-repo">Repo URL (Optional):
                            <input type="url" id="project-repo">
                        </label>
                        <label for="project-hackathon">Hackathon Link (Optional):
                            <input type="url" id="project-hackathon">
                        </label>
                        <button type="submit">Save Project</button>
                    </form>
                </div>

                <h2>Your Projects</h2>
                <div id="projects"></div>
                <div id="project-detail" style="display: none;">
                    <button id="back-button">Back to Projects</button>
                    <h3 id="detail-name"></h3>
                    <p id="detail-description"></p>
                    <p id="detail-repo"></p>
                    <p id="detail-hackathon"></p>
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="js/checklist.js"></script>
    <script type="module" src="js/github.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/model.js"></script>
    <script type="module" src="js/stats.js"></script>
    <script type="module" src="js/storage.js"></script>
    <script type="module" src="js/timer.js"></script>
    <script type="module" src="js/xp.js"></script>

</body>
</html>
